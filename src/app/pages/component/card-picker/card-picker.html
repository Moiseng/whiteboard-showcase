<div class="board_card_style_picker">
  @for (color of colors; track color) {
    <div
      class="board-card-style-color"
      [style.background-color]="color.hexValue"
      [style]="'--card-picker-box-shadow-color:' + color.boxShadowColor"
      (click)="setSelectedColor(color.hexValue)"
    ></div>
  }
</div>
